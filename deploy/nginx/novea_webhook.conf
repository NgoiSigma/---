server {
    listen 80;
    server_name disp.novea-atom.local;

    # Принудительный редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name disp.novea-atom.local;

    # Пути к сертификатам (например, от Let's Encrypt или самоподписанным)
    ssl_certificate /etc/ssl/certs/novea_disp.crt;
    ssl_certificate_key /etc/ssl/private/novea_disp.key;
    
    # Строгие настройки TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /webhook/telegram/ {
        # Проксирование запросов от серверов Telegram к локальному Python-боту
        proxy_pass http://127.0.0.1:8443/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ограничение размера тела запроса (защита от флуда)
        client_max_body_size 5M;
    }

    # Закрываем доступ ко всем остальным путям
    location / {
        return 404;
    }
}
